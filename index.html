<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e2e4e8;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1b1e25;
        --text: #e6e8eb;
        --muted: #9aa1ac;
        --border: #2c313a;
        --accent: #3b82f6;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      align-self: flex-start;
    }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    .add {
      padding: 10px 16px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }
    .filters {
      display: flex;
      gap: 4px;
      margin: 16px 0 8px;
    }
    .filters button {
      padding: 4px 10px;
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .filters button[aria-pressed="true"] {
      background: var(--bg);
      color: var(--text);
      font-weight: 600;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    .delete {
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      padding: 2px 6px;
    }
    .delete:hover { color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .clear { background: transparent; color: var(--muted); font-size: 0.875rem; padding: 0; }
    .clear:hover { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1>To-Do List</h1>

    <form id="add-form">
      <input id="new-task" type="text" placeholder="What needs doing?" autocomplete="off" aria-label="New task">
      <button class="add" type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="list"></ul>

    <footer>
      <span id="count"></span>
      <button class="clear" id="clear-done" type="button">Clear completed</button>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "todos";
    let todos = load();
    let filter = "all";

    const form = document.getElementById("add-form");
    const input = document.getElementById("new-task");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch {}
    }

    function render() {
      const visible = todos.filter(t =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done
      );

      list.innerHTML = "";
      if (visible.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = todos.length === 0 ? "Nothing to do yet. Add a task above." : "No tasks here.";
        list.appendChild(li);
      }

      for (const todo of visible) {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.setAttribute("aria-label", "Mark done");
        checkbox.addEventListener("change", () => {
          todo.done = checkbox.checked;
          save(); render();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.type = "button";
        del.textContent = "×";
        del.setAttribute("aria-label", "Delete task");
        del.addEventListener("click", () => {
          todos = todos.filter(t => t.id !== todo.id);
          save(); render();
        });

        li.append(checkbox, text, del);
        list.appendChild(li);
      }

      const left = todos.filter(t => !t.done).length;
      count.textContent = `${left} task${left === 1 ? "" : "s"} left`;
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now() + Math.random(), text, done: false });
      input.value = "";
      save(); render();
    });

    document.querySelectorAll(".filters button").forEach(btn => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        document.querySelectorAll(".filters button").forEach(b =>
          b.setAttribute("aria-pressed", b === btn ? "true" : "false")
        );
        render();
      });
    });

    document.getElementById("clear-done").addEventListener("click", () => {
      todos = todos.filter(t => !t.done);
      save(); render();
    });

    render();
  </script>
</body>
</html>
